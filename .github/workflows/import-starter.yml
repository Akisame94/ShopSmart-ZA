
name: Import Android Starter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          unzip -o ShopSmart-ZA-Android-Starter.zip
          cp -R ShopSmart-ZA/. .
          rm -rf ShopSmart-ZA
          rm ShopSmart-ZA-Android-Starter.zip

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/android.yml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Import ShopSmart ZA Android starter"
          git push